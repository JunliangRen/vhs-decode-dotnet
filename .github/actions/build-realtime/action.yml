name: Build Realtime native
description: Build the Windows x64 RF preview decoder with static DCA support
runs:
  using: composite
  steps:
    - name: Preserve Unix line endings in the FFmpeg build scripts
      shell: pwsh
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v6
      with:
        repository: FFmpeg/FFmpeg
        ref: f46e514491172d15bd74b4abb1814cd2f05a763e
        path: build-deps/ffmpeg
        persist-credentials: false
    - uses: msys2/setup-msys2@v2
      id: msys
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc make diffutils
    - name: Build static FFmpeg DCA decoder (7.1.3)
      shell: msys2 {0}
      working-directory: build-deps/ffmpeg
      run: |
        set -eu
        ./configure --prefix="$PWD/../prefix" --target-os=mingw32 --arch=x86_64 \
          --disable-shared --enable-static --disable-autodetect --disable-programs \
          --disable-doc --disable-network --disable-x86asm --disable-everything \
          --disable-avdevice --disable-avfilter --disable-avformat --disable-swresample \
          --disable-swscale --disable-postproc --enable-decoder=dca
        make -j4
        make install
    - name: Link Realtime native library
      shell: pwsh
      env:
        MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
      run: ./tools/build-realtime-preview-native.ps1 -Compiler "$env:MSYS_ROOT/mingw64/bin/gcc.exe" -FfmpegPrefix build-deps/prefix
