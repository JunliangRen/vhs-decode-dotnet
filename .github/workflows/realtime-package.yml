name: Verify released Realtime package
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Released NuGet version
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  restore-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore only from GitHub Packages and publish the media test host
        shell: pwsh
        env:
          VERSION: ${{ inputs.package_version }}
          READER: ${{ github.actor }}
          PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:VERSION -notmatch '^2\.33\.0-preview\.ci\.[0-9]+$') { throw 'Unexpected package version' }
          $root = Join-Path $env:RUNNER_TEMP 'consumer'
          New-Item -ItemType Directory $root | Out-Null
          Copy-Item tools/RegistryReleaseValidation/Host.csproj,tools/RegistryReleaseValidation/Program.cs,global.json $root
          Set-Location $root
          $env:NUGET_PACKAGES = "$root/cache"
          $env:NUGET_HTTP_CACHE_PATH = "$root/http"
          $feed = 'https://nuget.pkg.github.com/JunliangRen/index.json'
          "<configuration><packageSources><clear/><add key='github' value='$feed'/></packageSources><fallbackPackageFolders><clear/></fallbackPackageFolders></configuration>" | Set-Content NuGet.Config
          $env:NuGetPackageSourceCredentials_github = "Username=$env:READER;Password=$env:PACKAGE_TOKEN"
          dotnet restore Host.csproj --configfile NuGet.Config --packages "$root/cache" --no-http-cache "-p:PreviewVersion=$env:VERSION" -p:NuGetAudit=false
          dotnet publish Host.csproj -c Release --no-restore -o published --self-contained false "-p:PreviewVersion=$env:VERSION"
          $dir = "$root/cache/vhsdecode.preview.realtime/$env:VERSION"
          $metadata = Get-Content "$dir/.nupkg.metadata" -Raw | ConvertFrom-Json
          if ($metadata.source -ne $feed) { throw "Unexpected source $($metadata.source)" }
          foreach ($file in @('lib/net11.0/VHSDecode.Preview.Realtime.dll', 'runtimes/win-x64/native/vhsdecode_realtime_preview.dll')) {
            if ((Get-FileHash "$dir/$file").Hash -ne (Get-FileHash ("published/" + (Split-Path -Leaf $file))).Hash) { throw "Published DLL mismatch for $file" }
          }
          $nupkg = @(Get-ChildItem -Path "$root/cache" -Recurse -Filter '*.nupkg')
          if ($nupkg.Count -ne 1) { throw 'Expected only the Realtime package' }
          @{ version=$env:VERSION; source=$metadata.source; sha256=(Get-FileHash $nupkg[0].FullName).Hash } | ConvertTo-Json | Set-Content published/registry.json
      - uses: actions/upload-artifact@v4
        with:
          name: registry-host-win-x64
          path: ${{ runner.temp }}/consumer/published/
          if-no-files-found: error
          retention-days: 7
