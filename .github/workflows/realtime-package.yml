name: Realtime preview NuGet

on:
  pull_request:
    paths:
      - 'src/VHSDecode.Preview.Realtime/**'
      - 'src/VHSDecode.Preview.Native/**'
      - '.github/actions/build-realtime/**'
      - 'tools/RealtimePackageSmoke/**'
      - 'tools/build-realtime-preview-native.ps1'
      - '.github/workflows/realtime-package.yml'
      - 'global.json'
      - 'Directory.Build.props'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the verified prerelease to GitHub Packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: ./.github/actions/build-realtime
      - name: Pack native and managed assets
        id: pack
        shell: pwsh
        run: |
          $base = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $version = "$base-preview.ci.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "PREVIEW_VERSION=$version" >> $env:GITHUB_ENV
          dotnet pack src/VHSDecode.Preview.Realtime -c Release -o feed "-p:PackageVersion=$version"
      - name: Publish and run an isolated package consumer
        shell: pwsh
        run: |
          $hostDir = Join-Path $env:RUNNER_TEMP 'consumer'
          Copy-Item tools/RealtimePackageSmoke $hostDir -Recurse
          Copy-Item global.json $hostDir
          $feed = (Resolve-Path feed).Path
          Push-Location $hostDir
          dotnet restore --source $feed --packages ./cache "-p:PreviewPackageVersion=$env:PREVIEW_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish -c Release --no-restore -o published "-p:PreviewPackageVersion=$env:PREVIEW_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./published/RealtimePackageSmoke.exe
      - uses: actions/upload-artifact@v4
        with:
          name: realtime-nuget
          path: feed/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    needs: pack
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: realtime-nuget
          path: feed
      - name: Publish tested package to the producer's GitHub Packages feed
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_VERSION: ${{ needs.pack.outputs.version }}
        shell: pwsh
        run: |
          $feed = "https://nuget.pkg.github.com/$env:GITHUB_REPOSITORY_OWNER/index.json"
          $package = Get-Item "feed/VHSDecode.Preview.Realtime.$env:PREVIEW_VERSION.nupkg"
          dotnet nuget push $package.FullName --source $feed --api-key $env:GH_PACKAGES_TOKEN
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $consumer = Join-Path $env:RUNNER_TEMP 'registry-consumer'
          Copy-Item tools/RealtimePackageSmoke $consumer -Recurse
          Copy-Item global.json $consumer
          Push-Location $consumer
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content NuGet.Config
          dotnet nuget add source $feed -n github --configfile NuGet.Config
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:NuGetPackageSourceCredentials_github = "Username=$env:GITHUB_ACTOR;Password=$env:GH_PACKAGES_TOKEN"
          for ($i = 1; $i -le 5; $i++) {
            dotnet restore --configfile NuGet.Config --packages ./cache "-p:PreviewPackageVersion=$env:PREVIEW_VERSION"
            if (!$LASTEXITCODE) { break }
            if ($i -eq 5) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 10
          }
          $download = Get-ChildItem ./cache -Recurse -Filter '*.nupkg' -File
          if ($download.Count -ne 1 -or (Get-FileHash $download.FullName).Hash -ne (Get-FileHash $package.FullName).Hash) {
            throw "Registry package differs from the release artifact"
          }
          dotnet publish -c Release --no-restore -o published "-p:PreviewPackageVersion=$env:PREVIEW_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./published/RealtimePackageSmoke.exe
