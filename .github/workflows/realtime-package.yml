name: Isolated release registry replay host
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Exact Realtime package version
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  restore:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore and publish standalone consumer from GitHub Packages
        shell: pwsh
        env:
          VERSION: ${{ inputs.package_version }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:VERSION -notmatch '^2\.35\.0-preview\.ci\.\d+$') { throw 'Unexpected version' }
          $dir = Join-Path $env:RUNNER_TEMP 'consumer'
          Copy-Item tools/RegistryCvbsReplay $dir -Recurse
          Copy-Item global.json $dir
          Push-Location $dir
          '<configuration><packageSources><clear/><add key="github" value="https://nuget.pkg.github.com/JunliangRen/index.json"/></packageSources></configuration>' | Set-Content NuGet.Config
          $env:NuGetPackageSourceCredentials_github = "Username=$env:GITHUB_ACTOR;Password=$env:GH_PACKAGES_TOKEN"
          dotnet restore --packages ./cache --configfile NuGet.Config "-p:PreviewVersion=$env:VERSION" -p:NuGetAudit=false
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish -c Release --no-restore --self-contained false "-p:PreviewVersion=$env:VERSION" -o "$env:GITHUB_WORKSPACE/replay"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pkg = @(Get-ChildItem cache -Recurse -Filter '*.nupkg')
          if ($pkg.Count -ne 1 -or $pkg[0].Name -ine "VHSDecode.Preview.Realtime.$env:VERSION.nupkg") { throw 'Unexpected dependencies' }
          Get-FileHash $pkg[0].FullName
          Copy-Item $pkg[0].FullName "$env:GITHUB_WORKSPACE/replay"
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-registry-host
          path: replay/
          if-no-files-found: error
