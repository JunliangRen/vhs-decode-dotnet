name: Release build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build and test Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up .NET 11 Preview 6
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install pinned FFmpeg test dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '8.1.2'
          $expectedSha256 =
            'DB580001CAA24AC104C8CB856CD113A87B0A443F7BDF47D8C12B1D740584A2EC'
          $archiveName = "ffmpeg-$version-essentials_build.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $installRoot = Join-Path $env:RUNNER_TEMP "ffmpeg-$version"
          $downloadUrls = @(
            "https://github.com/GyanD/codexffmpeg/releases/download/$version/$archiveName",
            "https://www.gyan.dev/ffmpeg/builds/packages/$archiveName"
          )

          $downloaded = $false
          foreach ($url in $downloadUrls) {
            try {
              Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest `
                -Uri $url `
                -OutFile $archivePath `
                -ConnectionTimeoutSeconds 30 `
                -OperationTimeoutSeconds 180 `
                -MaximumRetryCount 1 `
                -RetryIntervalSec 5
              $actualSha256 = (Get-FileHash `
                -LiteralPath $archivePath `
                -Algorithm SHA256).Hash
              if ($actualSha256 -cne $expectedSha256) {
                throw "SHA-256 mismatch: expected $expectedSha256, got $actualSha256."
              }

              $downloaded = $true
              break
            }
            catch {
              Write-Warning "Download failed from ${url}: $($_.Exception.Message)"
            }
          }

          if (-not $downloaded) {
            throw 'Unable to download the pinned FFmpeg archive from either source.'
          }

          Expand-Archive `
            -LiteralPath $archivePath `
            -DestinationPath $installRoot `
            -Force
          $ffmpegPath = Get-ChildItem `
            -LiteralPath $installRoot `
            -Filter ffmpeg.exe `
            -File `
            -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if ($null -eq $ffmpegPath) {
            throw 'The pinned FFmpeg archive did not contain ffmpeg.exe.'
          }

          $binDirectory = Split-Path -Parent $ffmpegPath
          $ffprobePath = Join-Path $binDirectory 'ffprobe.exe'
          if (-not (Test-Path -LiteralPath $ffprobePath -PathType Leaf)) {
            throw 'The pinned FFmpeg archive did not contain ffprobe.exe.'
          }

          Add-Content -LiteralPath $env:GITHUB_PATH -Value $binDirectory
          $env:PATH = "$binDirectory;$env:PATH"
          & $ffmpegPath -version
          $ffmpegExitCode = $LASTEXITCODE
          & $ffprobePath -version
          $ffprobeExitCode = $LASTEXITCODE
          if ($ffmpegExitCode -ne 0 -or $ffprobeExitCode -ne 0) {
            throw (
              "Pinned FFmpeg validation failed. FFmpeg exit: $ffmpegExitCode; " +
              "FFprobe exit: $ffprobeExitCode.")
          }

      - name: Build and verify Intel IPP native bridge
        shell: pwsh
        run: ./tools/build-ipp-native.ps1

      - name: Verify Intel IPP artifact
        shell: pwsh
        run: |
          $artifact = 'artifacts/native/Release/win-x64/vhsdecode_ipp.dll'
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Missing native artifact: $artifact"
          }
          Get-Item -LiteralPath $artifact

      - name: Restore dependencies
        run: dotnet restore VHSDecodeDotNet.slnx

      - name: Build release
        run: dotnet build VHSDecodeDotNet.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --solution VHSDecodeDotNet.slnx --configuration Release --no-build --no-restore --minimum-expected-tests 1482

      - name: Run NumPy reduction scalar fallback tests
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.NumpyReductionMeanTests --minimum-expected-tests 13

      - name: Run current VHS sync scalar fallback tests
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.VhsSyncDetectorCurrentTests --minimum-expected-tests 36

      - name: Run current CTI AVX2 reciprocal gather tests
        env:
          VHSDECODE_REQUIRE_AVX_CTI_GATHER: "1"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*PinnedCurrentCtiAvx2ReciprocalGatherPreservesScalarBits*' --minimum-expected-tests 1

      - name: Run current CTI AVX2-disabled tests
        env:
          DOTNET_EnableAVX2: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.ChromaTransientImprovementCurrentTests --minimum-expected-tests 19

      - name: Run current CTI scalar fallback tests
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.ChromaTransientImprovementCurrentTests --minimum-expected-tests 19

      - name: Run current chroma ACC AVX-disabled tests
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.VhsChromaAutomaticGainCurrentTests --minimum-expected-tests 15

      - name: Run NumPy complex spectrum AVX2-disabled tests
        env:
          DOTNET_EnableAVX2: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.NumpyComplexMultiplyTests --minimum-expected-tests 28

      - name: Run NumPy complex spectrum scalar fallback tests
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.NumpyComplexMultiplyTests --minimum-expected-tests 28

      - name: Run VHS Rust FM scalar fallback tests
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.VhsRustUnwrapSimdTests --minimum-expected-tests 13

      - name: Run PocketFFT scalar fallback tests
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*PocketComplexFft*' --minimum-expected-tests 2

      - name: Run complex FFT direct-output AVX-disabled tests
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.PocketFftComplexStorageTests --minimum-expected-tests 5

      - name: Run complex FFT direct-output scalar fallback tests
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.PocketFftComplexStorageTests --minimum-expected-tests 5

      - name: Run large PocketFFT second-pass scalar fallback tests
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*LargeComplexFft*' --minimum-expected-tests 4

      - name: Run real PocketFFT radix-4 scalar fallback tests
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*RealFftRadix4AvxStagesPreserveScalarBitPatterns*' --minimum-expected-tests 4

      - name: Run final real PocketFFT radix-4 AVX equivalence test
        env:
          VHSDECODE_REQUIRE_AVX_REAL_RADIX4: "1"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*RealInverseFftFinalRadix4AvxStagePreservesScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run final real PocketFFT radix-4 scalar fallback test
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*RealInverseFftFinalRadix4AvxStagePreservesScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-8 AVX-disabled hash test
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*AvxRadix8StagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-5 AVX-disabled equivalence test
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*AvxRadix5StagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-5 scalar fallback equivalence test
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*AvxRadix5StagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-3 AVX equivalence test
        env:
          VHSDECODE_REQUIRE_AVX_RADIX3: "1"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*AvxRadix3StagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-3 AVX-disabled equivalence test
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*AvxRadix3StagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-3 scalar fallback equivalence test
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*AvxRadix3StagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-11 AVX2 equivalence test
        env:
          VHSDECODE_REQUIRE_AVX_RADIX11: "1"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*Avx2Radix11PacketStagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-11 AVX2-disabled equivalence test
        env:
          DOTNET_EnableAVX2: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*Avx2Radix11PacketStagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-11 AVX-disabled equivalence test
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*Avx2Radix11PacketStagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run PocketFFT radix-11 scalar fallback equivalence test
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*Avx2Radix11PacketStagesPreserveScalarSpecialValueBits*' --minimum-expected-tests 1

      - name: Run Float32 SOS common-section AVX-disabled hash test
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*Float32SosCommonSectionKernelsRemainBitExact*' --minimum-expected-tests 1

      - name: Run Float32 SOS checked-reference scalar fallback test
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*Float32SosGenericStateAccessMatchesCheckedReference*' --minimum-expected-tests 1

      - name: Run managed Super-Gaussian mask AVX equivalence test
        env:
          VHSDECODE_REQUIRE_AVX_SUPER_GAUSSIAN_MASK: "1"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*SuperGaussianMaskSimdPreservesScalarComplexBits*' --minimum-expected-tests 1

      - name: Run managed Super-Gaussian mask AVX-disabled equivalence test
        env:
          DOTNET_EnableAVX: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-method '*SuperGaussianMaskSimdPreservesScalarComplexBits*' --minimum-expected-tests 1

      - name: Run IPP Super-Gaussian scalar fallback tests
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter-class VHSDecode.Tests.Ipp.IppRealDft32Tests --minimum-expected-tests 15

      - name: Run PCM16 scalar fallback tests
        env:
          DOTNET_EnableAVX2: "0"
        run: dotnet test tests/VHSDecode.Tests/VHSDecode.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~LibsndfilePcm16SampleLoaderTests --minimum-expected-tests 64

      - name: Restore Windows x64 publish assets
        run: dotnet restore src/VHSDecode.Cli/VHSDecode.Cli.csproj --runtime win-x64

      - name: Publish self-contained single-file release
        run: dotnet publish src/VHSDecode.Cli/VHSDecode.Cli.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --property:PublishProfile=FolderProfile --output artifacts/publish/win-x64

      - name: Upload release build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: vhs-decode-dotnet-windows-${{ github.sha }}
          path: artifacts/publish/win-x64/
          if-no-files-found: error
          retention-days: 30
